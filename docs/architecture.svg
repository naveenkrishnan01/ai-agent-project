<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">personal_assistant on Amazon Bedrock AgentCore Runtime</text>

  <!-- Developer machine -->
  <rect x="20" y="60" width="200" height="150" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Developer machine</text>
  <text x="120" y="105" text-anchor="middle" font-size="11" fill="#333">docker buildx build</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#333">--platform linux/arm64</text>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#333">invoke_agentcore.py</text>
  <text x="120" y="167" text-anchor="middle" font-size="11" fill="#333">(boto3 bedrock-agentcore)</text>

  <!-- AWS boundary -->
  <rect x="260" y="60" width="700" height="600" rx="8" fill="none" stroke="#232f3e" stroke-width="2"/>
  <text x="280" y="85" font-size="13" font-weight="bold" fill="#232f3e">AWS (us-west-1)</text>

  <!-- ECR -->
  <rect x="290" y="110" width="160" height="70" rx="6" fill="#fff3e0" stroke="#e69138"/>
  <text x="370" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a4a00">Amazon ECR</text>
  <text x="370" y="152" text-anchor="middle" font-size="10" fill="#7a4a00">personal-assistant:latest</text>
  <text x="370" y="167" text-anchor="middle" font-size="10" fill="#7a4a00">(image repository)</text>

  <!-- IAM Role -->
  <rect x="290" y="210" width="160" height="70" rx="6" fill="#fce8e6" stroke="#c5221f"/>
  <text x="370" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1a17">IAM Role</text>
  <text x="370" y="252" text-anchor="middle" font-size="10" fill="#7a1a17">AgentCoreRuntimeRole</text>
  <text x="370" y="267" text-anchor="middle" font-size="10" fill="#7a1a17">(ECR pull, logs, X-Ray)</text>

  <!-- CloudWatch -->
  <rect x="290" y="310" width="160" height="70" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="370" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d91">CloudWatch Logs</text>
  <text x="370" y="352" text-anchor="middle" font-size="10" fill="#0b3d91">/aws/bedrock-agentcore/</text>
  <text x="370" y="367" text-anchor="middle" font-size="10" fill="#0b3d91">runtimes/personal_assistant-*</text>

  <!-- AgentCore Runtime microVM box -->
  <rect x="500" y="110" width="430" height="500" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="715" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d652d">Bedrock AgentCore Runtime</text>
  <text x="715" y="148" text-anchor="middle" font-size="10" fill="#0d652d">one isolated microVM per runtimeSessionId</text>
  <text x="715" y="163" text-anchor="middle" font-size="10" fill="#0d652d">(idle timeout 15m, max lifetime 8h)</text>

  <!-- Container box inside microVM -->
  <rect x="520" y="185" width="390" height="400" rx="8" fill="#ffffff" stroke="#188038" stroke-dasharray="4 3"/>
  <text x="715" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Container (linux/arm64)</text>

  <!-- FastAPI -->
  <rect x="545" y="225" width="340" height="80" rx="6" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="715" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">FastAPI + Uvicorn — port 8080</text>
  <text x="715" y="267" text-anchor="middle" font-size="10" fill="#7a5c00">POST /invocations  ·  GET /ping</text>
  <text x="715" y="284" text-anchor="middle" font-size="10" fill="#7a5c00">agent/agentcore_app.py (personal_assistant Agent)</text>

  <!-- arrow FastAPI -> agentspan server -->
  <line x1="715" y1="305" x2="715" y2="345" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="328" font-size="9" fill="#555">runtime.run()</text>

  <!-- agentspan server -->
  <rect x="545" y="350" width="340" height="90" rx="6" fill="#f3e8fd" stroke="#8430ce"/>
  <text x="715" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a1a7a">agentspan server — port 6767</text>
  <text x="715" y="392" text-anchor="middle" font-size="10" fill="#4a1a7a">Java 21 (Temurin) · Conductor OSS workflow engine</text>
  <text x="715" y="407" text-anchor="middle" font-size="10" fill="#4a1a7a">SQLite embedded store (credentials, workflow state)</text>
  <text x="715" y="422" text-anchor="middle" font-size="10" fill="#4a1a7a">current_date_time @tool worker (fork start method)</text>

  <!-- entrypoint note -->
  <rect x="545" y="455" width="340" height="50" rx="6" fill="#f5f5f5" stroke="#999"/>
  <text x="715" y="475" text-anchor="middle" font-size="10" fill="#333">entrypoint.sh: start java in background,</text>
  <text x="715" y="490" text-anchor="middle" font-size="10" fill="#333">wait for /actuator/health, then exec uvicorn</text>

  <!-- Outbound to Anthropic -->
  <rect x="545" y="525" width="340" height="55" rx="6" fill="#fde8e8" stroke="#c5221f"/>
  <text x="715" y="547" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1a17">Outbound HTTPS (NetworkMode: PUBLIC)</text>
  <text x="715" y="563" text-anchor="middle" font-size="10" fill="#7a1a17">-&gt; api.anthropic.com (claude-sonnet-5)</text>

  <!-- Arrows: developer -> ECR (build/push) -->
  <line x1="220" y1="120" x2="288" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="112" font-size="9" fill="#555">build &amp; push</text>

  <!-- Arrows: ECR -> Runtime (pull image) -->
  <line x1="450" y1="145" x2="518" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="185" font-size="9" fill="#555">pull image on</text>
  <text x="452" y="197" font-size="9" fill="#555">microVM start</text>

  <!-- Arrows: IAM Role -> Runtime (assumed by) -->
  <line x1="450" y1="245" x2="518" y2="245" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="238" font-size="9" fill="#555">assumed by</text>

  <!-- Arrows: Runtime -> CloudWatch (logs) -->
  <path d="M 518,470 C 470,470 450,400 450,345" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="410" font-size="9" fill="#555">stdout/stderr</text>

  <!-- Arrows: developer -> Runtime (invoke) -->
  <path d="M 120,210 C 120,650 500,650 518,610" fill="none" stroke="#0b3d91" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="645" font-size="10" fill="#0b3d91">invoke_agent_runtime(payload, runtimeSessionId, contentType=application/json)</text>

  <text x="500" y="690" text-anchor="middle" font-size="10" fill="#777">Deployed and verified working — see README.md "Challenges and fixes" for the issues resolved along the way.</text>
</svg>
